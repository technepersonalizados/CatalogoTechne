<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef174d"><title>Techne • Catálogo</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><img src="assets/logo-techne.png" alt="Techne"><span>CATÁLOGO</span></a><button id="cartBtn" class="cart-btn">🛒 <b id="cartCount">0</b></button></header>
<section class="hero"><span id="eyebrow">PERSONALIZADOS</span><h1 id="heroTitle">Escolha sua arte.</h1><p id="heroText">Encontre seu produto, escolha a quantidade e envie o pedido direto pelo WhatsApp.</p></section>
<section class="filters"><div id="searchBox" class="search"><span>⌕</span><input id="search" placeholder="Buscar produto, tema ou código..."></div><div id="categories" class="chips"></div><div id="themeLine" class="theme-line"><b>Tema:</b><select id="themes"><option value="">Todos</option></select></div></section>
<main id="products" class="grid"></main><div id="empty" class="empty hidden">Nenhum produto encontrado.</div><footer id="footerText">Techne • Produtos personalizados</footer>
<div id="productModal" class="overlay hidden"></div><div id="cartModal" class="overlay hidden"></div><script src="app.js"></script>
</body></html>
